<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Celsius To Farenheit</title>
  </head>

  <body>
    <h1>Celsius To Farenheit App</h1>
    <form
      onsubmit="
        convert();
        return false;
      "
      autocomplete="off"
    >
      <input
        type="text"
        name="celsius"
        id="celsiusDegree"
        placeholder="Celsius"
      />
      <input type="submit" value="Convert" />
    </form>
    <div id="farenheit"></div>

    <script src="./script.js"></script>
  </body>
</html>
