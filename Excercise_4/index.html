<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Welcome To game site</h1>
    <h3 id="bag"></h3>
    <form
      onsubmit="
        buy();
        return false;
      "
      autocomplete="off"
    >
      <label for="gameName">Game Name</label>
      <input type="text" name="game" id="gameName" />

      <label for="gamePrice">Game Price</label>
      <input type="text" name="price" id="gamePrice" />

      <input type="submit" value="Buy" />
    </form>
    <div id="result"></div>

    <script src="./script.js"></script>
  </body>
</html>
