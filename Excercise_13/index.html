<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form
      onsubmit="
        login();
        return false;
      "
      autocomplete="off"
    >
      <h1>Login Form</h1>
      <label for="usernameElement">Username: </label>
      <input type="text" name="username" id="usernameElement" />
      <div class="spacer"></div>
      <label for="passwordElement">Password: </label>
      <input type="password" name="passsword" id="passwordElement" />
      <div class="spacer"></div>
      <input type="submit" value="Login" />
    </form>
    <div id="root"></div>

    <script src="./script.js"></script>
  </body>
</html>
